<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - Red UNAM</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="style/styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand mb-0 h1">Red UNAM</span>

  <div class="ms-auto">
    <img src="images/logoUNAM.png" alt="Logo" class="logo-navbar">
  </div>
</nav>

<!-- CONTENIDO -->
<div class="container d-flex justify-content-center align-items-center mt-5">

  <div class="card shadow-lg p-4 registro-card">

    <h3 class="text-center mb-2">Crear cuenta</h3>
    <p class="text-center text-muted mb-4">Solo comunidad UNAM</p>

    <form id="formRegistro">

      <input type="text" class="form-control mb-3" id="nombre" placeholder="Nombre completo" required>

      <input type="text" class="form-control mb-3" id="email" placeholder="Correo institucional" required>

      <input type="text" class="form-control mb-3" id="cuenta" placeholder="Número de cuenta" required>

      <input type="password" class="form-control mb-3" id="password" placeholder="Contraseña" required>

      <button class="btn btn-primary w-100">Registrarse</button>

    </form>

    <!-- Imagen -->
    <div class="imagen-container mt-4">
      <img src="images/pumaUNAM.png" alt="UNAM" class="img-fluid imagen-unam">
    </div>

    <div id="mensaje" class="mt-3 text-center"></div>

  </div>

</div>

<!-- JS -->
<script>
const form = document.getElementById("formRegistro");
const mensaje = document.getElementById("mensaje");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  let nombre = document.getElementById("nombre").value.trim();
  let email = document.getElementById("email").value.trim();
  let cuenta = document.getElementById("cuenta").value.trim();
  let password = document.getElementById("password").value;

  // REGEX
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const cuentaRegex = /^\d{9}$/;
  const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

  // VALIDACIONES
  if (!nombre || !email || !cuenta || !password) {
    return mostrarError("Completa todos los campos");
  }

  if (!emailRegex.test(email)) {
    return mostrarError("Correo inválido");
  }

  // Ajustado para aceptar cualquier correo de la UNAM
  if (!email.endsWith("@unam.mx") && !email.endsWith(".unam.mx")) {
    return mostrarError("Solo correos UNAM permitidos");
  }

  if (!cuentaRegex.test(cuenta)) {
    return mostrarError("Número de cuenta debe tener 9 dígitos");
  }

  if (!passwordRegex.test(password)) {
    return mostrarError("Contraseña debe tener: Mayúscula, número, carácter especial y min. 8 caracteres");
  }

  // --- MODIFICACIÓN CLAVE: ENVIAR A MYSQL ---
  const datos = new FormData();
  datos.append("nombre", nombre);
  datos.append("email", email);
  datos.append("cuenta", cuenta);
  datos.append("password", password);

  fetch("/RedSocial/php/registro.php", {
    method: "POST",
    body: datos
  })
  .then(res => res.json())
  .then(data => {
    if (data.status === "success") {
      mostrarExito(data.message + " ✔");
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1500);
    } else {
      mostrarError(data.message);
    }
  })
  .catch(error => {
    console.error("Error:", error);
    mostrarError("Error de conexión con el servidor");
  });
});

function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger">${msg}</div>`;
}

function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success">${msg}</div>`;
}
</script>

</body>
</html>
