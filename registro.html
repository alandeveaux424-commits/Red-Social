<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Red UNAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Agregamos Bootstrap Icons para el ojo de la contraseña -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style/styles.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-3 shadow">
  <span class="navbar-brand mb-0 h1 fw-bold">Red UNAM</span>
  <div class="ms-auto">
    <img src="images/logoUNAM.png" alt="Logo" width="40">
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-lg p-4 registro-card" style="max-width: 450px; width: 100%; border-radius: 15px;">

    <h3 class="text-center mb-2 fw-bold">Crear cuenta</h3>
    <p class="text-center text-muted mb-4 small">Solo comunidad UNAM</p>

    <form id="formRegistro">
      <!-- Nombre -->
      <div class="mb-3">
        <label class="form-label small">Nombre completo</label>
        <input type="text" class="form-control" id="nombre" placeholder="Nombre Apellido" 
               pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$" title="Solo letras y espacios" required>
      </div>

      <!-- Fecha de Nacimiento -->
      <div class="mb-3">
        <label class="form-label small">Fecha de nacimiento</label>
        <input type="date" class="form-control" id="fecha_nacimiento" required>
      </div>

      <!-- Correo -->
      <div class="mb-3">
        <label class="form-label small">Correo institucional</label>
        <input type="email" class="form-control" id="email" placeholder="usuario@aragon.unam.mx" required>
        <div class="form-text" style="font-size: 0.7rem;">Usa tu correo @unam.mx o de tu facultad.</div>
      </div>

      <!-- Cuenta -->
      <div class="mb-3">
        <label class="form-label small">Número de cuenta</label>
        <input type="text" class="form-control" id="cuenta" placeholder="9 dígitos" maxlength="9" required>
      </div>

      <!-- Contraseña con botón Ocultar/Ver -->
      <div class="mb-4">
        <label class="form-label small">Contraseña segura</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" placeholder="••••••••" required>
          <button class="btn btn-outline-secondary" type="button" id="btnTogglePassword">
            <i class="bi bi-eye" id="iconEye"></i>
          </button>
        </div>
        <div class="form-text" style="font-size: 0.75rem;">Mín. 8 caracteres, mayúscula, número y símbolo.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Registrarse</button>
      
      <div class="text-center mt-3">
        <p class="small mb-0">¿Ya tienes cuenta? <a href="index.html" class="text-decoration-none fw-bold">Inicia sesión</a></p>
      </div>
    </form>

    <div id="mensaje" class="mt-3 text-center"></div>
  </div>
</div>

<!-- Scripts de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>

<script>
// Elementos del DOM
const form = document.getElementById("formRegistro");
const mensaje = document.getElementById("mensaje");
const btnTogglePassword = document.getElementById("btnTogglePassword");
const passwordEl = document.getElementById("password");
const iconEye = document.getElementById("iconEye");

// --- FUNCIONALIDAD: VER / OCULTAR CONTRASEÑA ---
if (btnTogglePassword) {
    btnTogglePassword.addEventListener("click", function() {
        // Alternar el tipo de input
        const isPassword = passwordEl.getAttribute("type") === "password";
        passwordEl.setAttribute("type", isPassword ? "text" : "password");
        
        // Alternar el icono de Bootstrap
        iconEye.classList.toggle("bi-eye");
        iconEye.classList.toggle("bi-eye-slash");
    });
}

// --- LÓGICA DE REGISTRO ---
form.addEventListener("submit", async function(e) {
  e.preventDefault();

  // Referencias para validaciones visuales
  const nombreEl = document.getElementById("nombre");
  const emailEl = document.getElementById("email");
  const cuentaEl = document.getElementById("cuenta");
  const fechaNacEl = document.getElementById("fecha_nacimiento");

  const nombreVal = nombreEl.value.trim();
  const emailVal = emailEl.value.trim();
  const cuentaVal = cuentaEl.value.trim();
  const passwordVal = passwordEl.value;
  const fechaNacVal = fechaNacEl.value;

  // Dominios UNAM (puedes añadir más a esta lista)
  const dominiosPermitidos = [
    "@unam.mx", "@aragon.unam.mx", "@acatlan.unam.mx", "@cuautitlan.unam.mx", 
    "@iztacala.unam.mx", "@zaragoza.unam.mx", "@ingenieria.unam.mx", "@cch.unam.mx",
    "@politicas.unam.mx", "@fca.unam.mx", "@derecho.unam.mx", "@economia.unam.mx",
    "@filos.unam.mx", "@facmed.unam.mx", "@quimica.unam.mx", "@psicologia.unam.mx"
  ];

  const cuentaRegex = /^\d{9}$/;
  const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
  const nombreRegex = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/;

  // Reset de estilos de error
  [nombreEl, emailEl, cuentaEl, passwordEl, fechaNacEl].forEach(i => i.classList.remove("is-invalid", "is-valid"));

  // --- VALIDACIONES ---
  if (!nombreRegex.test(nombreVal)) {
    nombreEl.classList.add("is-invalid");
    return mostrarError("Nombre inválido (solo letras y acentos)");
  }

  if (!fechaNacVal) {
    fechaNacEl.classList.add("is-invalid");
    return mostrarError("La fecha de nacimiento es requerida");
  }

  const esDominioValido = dominiosPermitidos.some(dom => emailVal.endsWith(dom));
  if (!esDominioValido) {
    emailEl.classList.add("is-invalid");
    return mostrarError("Usa un correo institucional UNAM válido");
  }

  if (!cuentaRegex.test(cuentaVal)) {
    cuentaEl.classList.add("is-invalid");
    return mostrarError("El número de cuenta debe tener 9 dígitos");
  }

  if (!passwordRegex.test(passwordVal)) {
    passwordEl.classList.add("is-invalid");
    return mostrarError("Contraseña insegura: requiere 8 caracteres, Mayúscula, Número y Símbolo");
  }

  try {
    if (!window.supabaseClient) throw new Error("Error: Cliente de base de datos no listo.");

    // Enviamos los datos a la tabla 'usuarios'
    const { data, error } = await window.supabaseClient
      .from('usuarios')
      .insert([{
        nombre: nombreVal,
        email: emailVal,
        numero_cuenta: cuentaVal,
        password: passwordVal,
        fecha_nacimiento: fechaNacVal
      }]);

    if (error) {
      if (error.code === '23505') {
        emailEl.classList.add("is-invalid");
        cuentaEl.classList.add("is-invalid");
        throw new Error("El correo o el número de cuenta ya existen");
      }
      throw error;
    }

    // Éxito
    [nombreEl, emailEl, cuentaEl, passwordEl, fechaNacEl].forEach(i => i.classList.add("is-valid"));
    mostrarExito("¡Cuenta creada con éxito! Redirigiendo...");
    form.reset();

    setTimeout(() => { 
      window.location.href = "index.html"; 
    }, 2000);

  } catch (err) {
    console.error("Error en Registro:", err);
    mostrarError(err.message);
  }
});

function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger py-2 small shadow-sm">${msg}</div>`;
}

function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success py-2 small shadow-sm">${msg}</div>`;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
