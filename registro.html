<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Red UNAM</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="style/styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand mb-0 h1">Red UNAM</span>
  <div class="ms-auto">
    <img src="images/logoUNAM.png" alt="Logo" class="logo-navbar" width="40">
  </div>
</nav>

<!-- CONTENIDO -->
<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-lg p-4 registro-card" style="max-width: 450px; width: 100%;">

    <h3 class="text-center mb-2">Crear cuenta</h3>
    <p class="text-center text-muted mb-4">Solo comunidad UNAM</p>

    <form id="formRegistro">
      <div class="mb-3">
        <input type="text" class="form-control" id="nombre" placeholder="Nombre completo" required>
      </div>

      <div class="mb-3">
        <input type="email" class="form-control" id="email" placeholder="Correo institucional (@unam.mx)" required>
      </div>

      <div class="mb-3">
        <input type="text" class="form-control" id="cuenta" placeholder="Número de cuenta (9 dígitos)" required>
      </div>

      <div class="mb-3">
        <input type="password" class="form-control" id="password" placeholder="Contraseña segura" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Registrarse</button>
    </form>

    <!-- Imagen -->
    <div class="imagen-container mt-4 text-center">
      <img src="images/pumaUNAM.png" alt="UNAM" class="img-fluid imagen-unam" style="max-height: 100px;">
    </div>

    <div id="mensaje" class="mt-3 text-center"></div>

  </div>
</div>

<!-- 🛠 SCRIPTS -->

<!-- 1. Librería Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Tu configuración (URL y Key de Supabase) -->
<script src="js/conexion.js"></script>

<script>
const form = document.getElementById("formRegistro");
const mensaje = document.getElementById("mensaje");

form.addEventListener("submit", async function(e) { // Usamos async para Supabase
  e.preventDefault();

  const nombre = document.getElementById("nombre").value.trim();
  const email = document.getElementById("email").value.trim();
  const cuenta = document.getElementById("cuenta").value.trim();
  const password = document.getElementById("password").value;

  // REGEX PARA VALIDACIÓN
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const cuentaRegex = /^\d{9}$/;
  const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

  // --- VALIDACIONES FRONTEND ---
  if (!nombre || !email || !cuenta || !password) {
    return mostrarError("Completa todos los campos");
  }

  if (!emailRegex.test(email) || (!email.endsWith("@unam.mx") && !email.endsWith(".unam.mx"))) {
    return mostrarError("Usa un correo institucional válido de la UNAM");
  }

  if (!cuentaRegex.test(cuenta)) {
    return mostrarError("El número de cuenta debe tener exactamente 9 dígitos");
  }

  if (!passwordRegex.test(password)) {
    return mostrarError("Contraseña insegura (mín. 8 caracteres, una mayúscula, un número y un símbolo)");
  }

  // --- CONEXIÓN CON SUPABASE ---
  try {
    // Insertamos los datos en la tabla 'usuarios' que ya configuraste
    const { data, error } = await window.supabaseClient
      .from('usuarios')
      .insert([
        { 
          nombre: nombre, 
          email: email, 
          numero_cuenta: cuenta, 
          password: password 
        }
      ]);

    // Manejo de errores específicos (ej. duplicados)[cite: 1]
    if (error) {
      if (error.code === '23505') { // Código PostgreSQL para violación de unicidad
        throw new Error("El correo o el número de cuenta ya están registrados");
      }
      throw error;
    }

    // ÉXITO
    mostrarExito("¡Cuenta creada correctamente! Redirigiendo...");
    
    setTimeout(() => {
      window.location.href = "login.html"; // Cambiado a login para iniciar sesión formalmente
    }, 1500);

  } catch (err) {
    console.error("Error de registro:", err.message);
    mostrarError(err.message || "Error al conectar con la base de datos");
  }
});

function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger py-2">${msg}</div>`;
}

function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success py-2">${msg}</div>`;
}
</script>

</body>
</html>
