<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Red UNAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/styles.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand mb-0 h1">Red UNAM</span>
  <div class="ms-auto">
    <img src="images/logoUNAM.png" alt="Logo" class="logo-navbar" width="40">
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-lg p-4 registro-card" style="max-width: 450px; width: 100%;">

    <h3 class="text-center mb-2">Crear cuenta</h3>
    <p class="text-center text-muted mb-4">Solo comunidad UNAM</p>

    <form id="formRegistro">
      <div class="mb-3">
        <input type="text" class="form-control" id="nombre" placeholder="Nombre completo" required>
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" id="email" placeholder="Correo institucional (@unam.mx)" required>
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" id="cuenta" placeholder="Número de cuenta (9 dígitos)" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="password" placeholder="Contraseña segura" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Registrarse</button>
    </form>

    <div class="imagen-container mt-4 text-center">
      <img src="images/pumaUNAM.png" alt="UNAM" class="img-fluid imagen-unam" style="max-height: 100px;">
    </div>

    <div id="mensaje" class="mt-3 text-center"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script>
const form     = document.getElementById("formRegistro");
const mensaje  = document.getElementById("mensaje");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const nombreEl   = document.getElementById("nombre");
  const emailEl    = document.getElementById("email");
  const cuentaEl   = document.getElementById("cuenta");
  const passwordEl = document.getElementById("password");

  const nombre   = nombreEl.value.trim();
  const email    = emailEl.value.trim();
  const cuenta   = cuentaEl.value.trim();
  const password = passwordEl.value;

  // REGEX
  const emailRegex    = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const cuentaRegex   = /^\d{9}$/;
  const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

  // Reset estilos
  [nombreEl, emailEl, cuentaEl, passwordEl].forEach(i => i.classList.remove("is-invalid", "is-valid"));

  // Validaciones
  if (!nombre) {
    nombreEl.classList.add("is-invalid");
    return mostrarError("El nombre es obligatorio");
  }
  if (!emailRegex.test(email) || !email.endsWith("@unam.mx")) {
    emailEl.classList.add("is-invalid");
    return mostrarError("Solo se permiten correos @unam.mx");
  }
  if (!cuentaRegex.test(cuenta)) {
    cuentaEl.classList.add("is-invalid");
    return mostrarError("Número de cuenta inválido (9 dígitos)");
  }
  if (!passwordRegex.test(password)) {
    passwordEl.classList.add("is-invalid");
    return mostrarError("Contraseña insegura (mín 8 caracteres, una mayúscula, un número y un símbolo)");
  }

  try {
    // Hashear contraseña antes de guardar
    const passwordHash = await window.hashPassword(password);

    const { data, error } = await window.supabaseClient
      .from('usuarios')
      .insert([{
        nombre:        nombre,
        email:         email,
        numero_cuenta: cuenta,
        password:      passwordHash
      }]);

    if (error) {
      if (error.code === '23505') {
        emailEl.classList.add("is-invalid");
        cuentaEl.classList.add("is-invalid");
        throw new Error("El correo o número de cuenta ya están registrados");
      }
      throw error;
    }

    [nombreEl, emailEl, cuentaEl, passwordEl].forEach(i => i.classList.add("is-valid"));
    mostrarExito("¡Cuenta creada correctamente! Redirigiendo...");
    form.reset();

    setTimeout(() => { window.location.href = "iniciarsesion.html"; }, 1500);

  } catch (err) {
    console.error("Error en registro:", err.message);
    mostrarError(err.message || "Error al conectar con Supabase");
  }
});

function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger py-2">${msg}</div>`;
}
function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success py-2">${msg}</div>`;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
