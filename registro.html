<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Red UNAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/styles.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand mb-0 h1">Red UNAM</span>
  <div class="ms-auto">
    <img src="images/logoUNAM.png" alt="Logo" class="logo-navbar" width="40">
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-lg p-4 registro-card" style="max-width: 450px; width: 100%;">

    <h3 class="text-center mb-2">Crear cuenta</h3>
    <p class="text-center text-muted mb-4">Solo comunidad UNAM</p>

    <form id="formRegistro">
      <div class="mb-3">
        <input type="text" class="form-control" id="nombre" placeholder="Nombre completo" 
              pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$" title="Solo se permiten letras y acentos" required>
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" id="email" placeholder="Correo institucional" required>
        <div class="form-text">Ej: usuario@aragon.unam.mx</div>
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" id="cuenta" placeholder="Número de cuenta (9 dígitos)" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="password" placeholder="Contraseña segura" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Registrarse</button>
    </form>

    <div class="imagen-container mt-4 text-center">
      <img src="images/pumaUNAM.png" alt="UNAM" class="img-fluid imagen-unam" style="max-height: 100px;">
    </div>

    <div id="mensaje" class="mt-3 text-center"></div>
  </div>
</div>

<!-- ORDEN CRÍTICO DE SCRIPTS -->
<!-- 1. Librería Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- 2. Tu configuración global (window.supabaseClient) -->
<script src="js/conexion.js"></script>

<script>
const form     = document.getElementById("formRegistro");
const mensaje  = document.getElementById("mensaje");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const nombreEl   = document.getElementById("nombre");
  const emailEl    = document.getElementById("email");
  const cuentaEl   = document.getElementById("cuenta");
  const passwordEl = document.getElementById("password");

  const nombre   = nombreEl.value.trim();
  const email    = emailEl.value.trim();
  const cuenta   = cuentaEl.value.trim();
  const password = passwordEl.value;

  // --- LISTA DE DOMINIOS AUTORIZADOS ---
  const dominiosPermitidos = [
    "@unam.mx", "@arquitectura.unam.mx", "@fad.unam.mx", "@ciencias.unam.mx",
    "@politicas.unam.mx", "@fca.unam.mx", "@derecho.unam.mx", "@economia.unam.mx",
    "@filos.unam.mx", "@ingenieria.unam.mx", "@facmed.unam.mx", "@fmvz.unam.mx",
    "@musica.unam.mx", "@odontologia.unam.mx", "@psicologia.unam.mx", "@quimica.unam.mx",
    "@aragon.unam.mx", "@acatlan.unam.mx", "@cuautitlan.unam.mx", "@iztacala.unam.mx", "@zaragoza.unam.mx",
    "@enes.morelia.unam.mx", "@enes.leon.unam.mx", "@enes.juriquilla.unam.mx", "@cch.unam.mx", "@enp.unam.mx"

  ];

  // REGEX
  const emailRegex    = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const cuentaRegex   = /^\d{9}$/;
  const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

  // Reset estilos
  [nombreEl, emailEl, cuentaEl, passwordEl].forEach(i => i.classList.remove("is-invalid", "is-valid"));

  // --- VALIDACIONES FRONTEND ---
  if (!nombre) {
    nombreEl.classList.add("is-invalid");
    return mostrarError("El nombre es obligatorio");
  }

  // Validación de correos de Facultades
  const esDominioValido = dominiosPermitidos.some(dom => email.endsWith(dom));
  if (!emailRegex.test(email) || !esDominioValido) {
    emailEl.classList.add("is-invalid");
    return mostrarError("Usa un correo institucional válido (ej: @aragon.unam.mx)");
  }

  if (!cuentaRegex.test(cuenta)) {
    cuentaEl.classList.add("is-invalid");
    return mostrarError("Número de cuenta inválido (9 dígitos)");
  }

  if (!passwordRegex.test(password)) {
    passwordEl.classList.add("is-invalid");
    return mostrarError("Contraseña insegura (mín 8 caracteres, una mayúscula, un número y un símbolo)");
  }

  try {
    // Verificación de conexión[cite: 1]
    if (!window.supabaseClient) throw new Error("Error: No se pudo conectar con la base de datos.");

    const { data, error } = await window.supabaseClient
      .from('usuarios')
      .insert([{
        nombre: nombre,
        email: email,
        numero_cuenta: cuenta,
        password: password // Supabase cifra la comunicación vía SSL
      }]);

    if (error) {
      if (error.code === '23505') { // Error de duplicado
        emailEl.classList.add("is-invalid");
        cuentaEl.classList.add("is-invalid");
        throw new Error("El correo o número de cuenta ya están registrados");
      }
      throw error;
    }

    [nombreEl, emailEl, cuentaEl, passwordEl].forEach(i => i.classList.add("is-valid"));
    mostrarExito("¡Cuenta creada correctamente! Redirigiendo...");
    form.reset();

    setTimeout(() => { window.location.href = "index.html"; }, 1500);

  } catch (err) {
    console.error("Error en registro:", err.message);
    mostrarError(err.message || "Error al conectar con Supabase");
  }
});

function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger py-2">${msg}</div>`;
}
function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success py-2">${msg}</div>`;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
