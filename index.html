<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red UNAM - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/styles.css">
  <style>
    .ratio-16x9 { border: 2px solid #0d6efd; }
    .perfil-dropdown img { border: 2px solid #0d6efd; }
    .nav-link#facultadNav { color: #ffc107 !important; font-weight: bold; } /* Color dorado para la facultad */
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="images/logoUNAM.png" width="45" class="me-2" alt="Logo UNAM">
      <strong>Red UNAM</strong>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="noticias.html">Noticias</a></li>
        <li class="nav-item"><a class="nav-link" href="grupos.html">Grupos</a></li>
        
        <!-- 🎓 APARTADO DE FACULTAD DINÁMICA -->
        <li class="nav-item">
          <a class="nav-link" href="facultad.html" id="facultadNav"></a>
        </li>
      </ul>
      
      <div id="authArea">
        <button class="btn btn-light btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#loginModal">
          Iniciar sesión
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<div class="container mt-5 text-center">
  <h1 class="display-5">Bienvenido a Red UNAM</h1>
  <p class="lead text-muted">Comunidad estudiantil universitaria.</p>
</div>

<div class="container mt-4 mb-5">
  <h3 class="text-center mb-3">📰 Gaceta UNAM</h3>
  <div class="ratio ratio-16x9 border rounded shadow-sm bg-light">
    <iframe src="https://www.gaceta.unam.mx/" title="Gaceta UNAM" style="border:0;" loading="lazy"></iframe>
  </div>
  <p class="text-center mt-3">
    <a href="https://www.gaceta.unam.mx/" target="_blank" class="btn btn-outline-primary btn-sm">Ir a Gaceta UNAM</a>
  </p>
</div>

<!-- MODAL LOGIN -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="card p-4">
        <div class="text-end">
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="text-center mb-4">
          <img src="images/pumaUNAM.png" width="60" class="mb-2">
          <h3>Iniciar sesión</h3>
        </div>
        
        <form id="formLogin">
          <div class="mb-3">
            <input type="text" class="form-control" id="emailLogin" placeholder="Correo o número de cuenta" required>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" id="passwordLogin" placeholder="Contraseña" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
        </form>
        
        <p class="text-center mt-4 small">
          ¿No tienes cuenta? <a href="registro.html" class="text-decoration-none">Regístrate aquí</a>
        </p>
        <div id="mensaje" class="mt-2 text-center"></div>
      </div>
    </div>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const form    = document.getElementById("formLogin");
const mensaje = document.getElementById("mensaje");

// Mapa de dominios a nombres de Instituciones
const mapeoFacultades = {
  "@arquitectura.unam.mx": "Arquitectura",
  "@fad.unam.mx": "FAD",
  "@ciencias.unam.mx": "Ciencias",
  "@politicas.unam.mx": "Políticas",
  "@fca.unam.mx": "FCA",
  "@derecho.unam.mx": "Derecho",
  "@economia.unam.mx": "Economía",
  "@filos.unam.mx": "Filosofía",
  "@ingenieria.unam.mx": "Ingeniería",
  "@facmed.unam.mx": "Medicina",
  "@fmvz.unam.mx": "Veterinaria",
  "@musica.unam.mx": "Música",
  "@odontologia.unam.mx": "Odontología",
  "@psicologia.unam.mx": "Psicología",
  "@quimica.unam.mx": "Química",
  "@unam.mx": "UNAM"
};

if (form) {
  form.addEventListener("submit", async function(e) {
    e.preventDefault();
    const input    = document.getElementById("emailLogin").value.trim();
    const password = document.getElementById("passwordLogin").value;

    try {
      const { data, error } = await window.supabaseClient
        .from('usuarios')
        .select('*')
        .or(`email.eq."${input}",numero_cuenta.eq."${input}"`)
        .single();

      if (error || !data) throw new Error("Credenciales incorrectas");
      if (data.password !== password) throw new Error("Contraseña incorrecta");

      // Deducir la facultad del correo
      let facultadDetectada = "Comunidad UNAM";
      for (const dominio in mapeoFacultades) {
        if (data.email.endsWith(dominio)) {
          facultadDetectada = mapeoFacultades[dominio];
          break;
        }
      }

      // Guardar sesión incluyendo la facultad detectada
      localStorage.setItem("sesion", JSON.stringify({
        nombre: data.nombre,
        email: data.email,
        facultad: facultadDetectada
      }));

      mostrarExito("¡Bienvenido!");
      setTimeout(() => {
        bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
        actualizarBotonSesion();
      }, 1000);

    } catch (err) {
      mostrarError(err.message);
    }
  });
}

function actualizarBotonSesion() {
  const authArea = document.getElementById("authArea");
  const facultadNav = document.getElementById("facultadNav");
  const sesion = JSON.parse(localStorage.getItem("sesion"));

  if (sesion) {
    // 1. Mostrar la facultad en el menú al lado de Grupos
    if (facultadNav) {
      facultadNav.innerHTML = `🎓 ${sesion.facultad}`;
    }

    // 2. Mostrar el menú de usuario
    authArea.innerHTML = `
      <div class="dropdown">
        <button class="btn btn-light btn-sm dropdown-toggle fw-bold" data-bs-toggle="dropdown">
          ${sesion.nombre.split(' ')[0]}
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow">
          <li class="px-3 py-2 text-center">
            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(sesion.nombre)}&background=0D6EFD&color=fff" class="rounded-circle mb-2" width="40">
            <div class="fw-bold small">${sesion.nombre}</div>
            <div class="text-muted small">${sesion.facultad}</div>
          </li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item text-danger small" id="logout">Cerrar sesión</button></li>
        </ul>
      </div>`;
    
    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("sesion");
      location.reload();
    });
  } else {
    if (facultadNav) facultadNav.innerHTML = ""; // Limpiar si no hay sesión
    authArea.innerHTML = `<button class="btn btn-light btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#loginModal">Iniciar sesión</button>`;
  }
}

function mostrarError(msg) { mensaje.innerHTML = `<div class="alert alert-danger py-2 mt-2 small">${msg}</div>`; }
function mostrarExito(msg) { mensaje.innerHTML = `<div class="alert alert-success py-2 mt-2 small">${msg}</div>`; }

document.addEventListener("DOMContentLoaded", actualizarBotonSesion);
</script>
</body>
</html>
