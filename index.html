<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red UNAM - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/styles.css">
  <style>
    /* Estilos adicionales para mejorar la UI */
    .ratio-16x9 { border: 2px solid #0d6efd; }
    .perfil-dropdown img { border: 2px solid #0d6efd; }
    .alert { font-size: 0.9rem; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="images/logoUNAM.png" width="45" class="me-2" alt="Logo UNAM">
      <strong>Red UNAM</strong>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="noticias.html">Noticias</a></li>
        <li class="nav-item"><a class="nav-link" href="grupos.html">Grupos</a></li>
      </ul>
      
      <!-- AREA DE AUTENTICACIÓN DINÁMICA -->
      <div id="authArea">
        <button class="btn btn-light btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#loginModal">
          Iniciar sesión
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<div class="container mt-5 text-center">
  <h1 class="display-5">Bienvenido a Red UNAM</h1>
  <p class="lead text-muted">La red social exclusiva para la comunidad estudiantil universitaria.</p>
</div>

<div class="container mt-4 mb-5">
  <h3 class="text-center mb-3">📰 Gaceta UNAM</h3>
  <div class="ratio ratio-16x9 border rounded shadow-sm bg-light">
    <iframe src="https://www.gaceta.unam.mx/" title="Gaceta UNAM" style="border:0;" loading="lazy"></iframe>
  </div>
  <p class="text-center mt-3">
    <a href="https://www.gaceta.unam.mx/" target="_blank" class="btn btn-outline-primary btn-sm">Ver en sitio oficial</a>
  </p>
</div>

<!-- MODAL LOGIN -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="card p-4">
        <div class="text-end">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="text-center mb-4">
          <img src="images/pumaUNAM.png" width="60" class="mb-2">
          <h3>Iniciar sesión</h3>
        </div>
        
        <form id="formLogin">
          <div class="mb-3">
            <label class="form-label small">Correo o Número de Cuenta</label>
            <input type="text" class="form-control" id="emailLogin" placeholder="usuario@ingenieria.unam.mx" required>
          </div>
          <div class="mb-3">
            <label class="form-label small">Contraseña</label>
            <input type="password" class="form-control" id="passwordLogin" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
        </form>
        
        <p class="text-center mt-4 small">
          ¿No tienes cuenta? <a href="registro.html" class="text-decoration-none">Regístrate aquí</a>
        </p>
        <div id="mensaje" class="mt-2 text-center"></div>
      </div>
    </div>
  </div>
</div>

<!-- SCRIPTS DE FUNCIONAMIENTO -->
<!-- 1. Librería Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- 2. Tu archivo de conexión (window.supabaseClient) -->
<script src="js/conexion.js"></script>
<!-- 3. Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const form    = document.getElementById("formLogin");
const mensaje = document.getElementById("mensaje");

// LÓGICA DE INICIO DE SESIÓN
if (form) {
  form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const input    = document.getElementById("emailLogin").value.trim();
    const password = document.getElementById("passwordLogin").value;

    if (!input || !password) return mostrarError("Completa todos los campos");

    try {
      // Buscamos al usuario en Supabase por email O número de cuenta
      const { data, error } = await window.supabaseClient
        .from('usuarios')
        .select('*')
        .or(`email.eq."${input}",numero_cuenta.eq."${input}"`)
        .single();

      if (error || !data) throw new Error("Credenciales no encontradas");

      // Validamos contraseña (texto plano por ahora)
      if (data.password !== password) {
        throw new Error("Contraseña incorrecta");
      }

      // Éxito: Guardamos los datos necesarios en LocalStorage
      mostrarExito("¡Bienvenido, " + data.nombre + "!");

      localStorage.setItem("sesion", JSON.stringify({
        id:            data.id,
        nombre:        data.nombre,
        email:         data.email,
        numero_cuenta: data.numero_cuenta
      }));

      // Esperar un momento y cerrar el modal
      setTimeout(() => {
        const modalEl = document.getElementById('loginModal');
        const modal   = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();
        actualizarBotonSesion();
      }, 1200);

    } catch (err) {
      console.error("Error Login:", err.message);
      mostrarError(err.message || "Error al conectar con la base de datos");
    }
  });
}

// ACTUALIZACIÓN DE LA INTERFAZ DE USUARIO
function actualizarBotonSesion() {
  const authArea = document.getElementById("authArea");
  const sesion   = JSON.parse(localStorage.getItem("sesion"));

  if (sesion) {
    // Si hay sesión activa, mostramos el menú del perfil
    authArea.innerHTML = `
      <div class="dropdown">
        <button class="btn btn-light btn-sm dropdown-toggle fw-bold" data-bs-toggle="dropdown">
          ${sesion.nombre.split(' ')[0]}
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow perfil-dropdown">
          <li class="px-3 py-2 text-center">
            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(sesion.nombre)}&background=0D6EFD&color=fff" 
                 class="rounded-circle mb-2" width="45">
            <div class="fw-bold small">${sesion.nombre}</div>
            <div class="text-muted" style="font-size: 0.75rem;">${sesion.email}</div>
          </li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item text-danger small" id="logout">Cerrar sesión</button></li>
        </ul>
      </div>
    `;
    
    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("sesion");
      location.reload();
    });
  } else {
    // Si no hay sesión, mostramos el botón de ingreso
    authArea.innerHTML = `
      <button class="btn btn-light btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#loginModal">
        Iniciar sesión
      </button>
    `;
  }
}

// FUNCIONES AUXILIARES DE MENSAJES
function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger py-2 mt-2">${msg}</div>`;
}

function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success py-2 mt-2">${msg}</div>`;
}

// Ejecutar al cargar la página
document.addEventListener("DOMContentLoaded", actualizarBotonSesion);
</script>

</body>
</html>
