<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red UNAM</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/styles.css">
  <style>
    .nav-link#facultadNav { color: #ffc107 !important; font-weight: bold; }
  </style>
</head>
<body>

<!-- 🔵 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="images/logoUNAM.png" width="45" class="me-2">
      <strong>Red UNAM</strong>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="noticias.html">Noticias</a></li>
        <li class="nav-item"><a class="nav-link" href="grupos.html">Grupos</a></li>
        <!-- 🎓 FACULTAD DINÁMICA -->
        <li class="nav-item">
          <a class="nav-link" href="facultad.html" id="facultadNav"></a>
        </li>
      </ul>
      <!-- 🔐 AUTH AREA -->
      <div id="authArea">
        <button class="btn btn-light btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#loginModal">
          Iniciar sesión
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-5 text-center">
  <h1>Bienvenido a Red UNAM</h1>
  <p class="lead">Comunidad estudiantil universitaria</p>
</div>

<!-- 🔵 GACETA -->
<div class="container mt-4 mb-5">
  <h3 class="text-center mb-3">Gaceta UNAM</h3>
  <div class="ratio ratio-16x9 border rounded shadow bg-light">
    <iframe src="https://www.gaceta.unam.mx/" style="border:0;" loading="lazy"></iframe>
  </div>
  <p class="text-center mt-3">
    <a href="https://www.gaceta.unam.mx/" target="_blank" class="btn btn-outline-primary btn-sm">Ir a Gaceta UNAM</a>
  </p>
</div>

<!-- 🔥 MODAL LOGIN -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="card p-4">
        <div class="text-end">
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="text-center mb-3">
          <h3>Iniciar sesión</h3>
        </div>
        <form id="formLogin">
          <!-- IDs originales restaurados: email y password -->
          <div class="mb-3">
            <input type="text" class="form-control" id="email" placeholder="Correo @unam.mx o número de cuenta" required>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">Iniciar sesión</button>
        </form>
        <p class="text-center mt-3 small">
          ¿No tienes cuenta? <a href="registro.html" class="text-decoration-none">Regístrate aquí</a>
        </p>
        <div id="mensaje" class="mt-3 text-center"></div>
      </div>
    </div>
  </div>
</div>

<!-- JS: Scripts de conexión y lógica -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const form = document.getElementById("formLogin");
const mensaje = document.getElementById("mensaje");

// Mapeo exacto de dominios a nombres de Institución
const mapeoFacultades = {
  "@arquitectura.unam.mx": "Arquitectura",
  "@fad.unam.mx": "FAD",
  "@ciencias.unam.mx": "Ciencias",
  "@politicas.unam.mx": "Políticas",
  "@fca.unam.mx": "FCA",
  "@derecho.unam.mx": "Derecho",
  "@economia.unam.mx": "Economía",
  "@filos.unam.mx": "Filosofía",
  "@ingenieria.unam.mx": "Ingeniería",
  "@facmed.unam.mx": "Medicina",
  "@fmvz.unam.mx": "Veterinaria",
  "@musica.unam.mx": "Música",
  "@odontologia.unam.mx": "Odontología",
  "@psicologia.unam.mx": "Psicología",
  "@quimica.unam.mx": "Química",
  "@unam.mx": "UNAM"
};

if (form) {
  form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const input = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!input || !password) return mostrarError("Completa los campos");

    try {
      // Conexión con Supabase usando el cliente global
      const { data, error } = await window.supabaseClient
        .from('usuarios')
        .select('*')
        .or(`email.eq."${input}",numero_cuenta.eq."${input}"`)
        .single();

      if (error || !data) throw new Error("Credenciales incorrectas");
      if (data.password !== password) throw new Error("Contraseña incorrecta");

      // Lógica para extraer el nombre de la institución según el correo
      let nombreFacultad = "Comunidad UNAM";
      for (const dominio in mapeoFacultades) {
        if (data.email.endsWith(dominio)) {
          nombreFacultad = mapeoFacultades[dominio];
          break;
        }
      }

      // Guardar sesión en LocalStorage con la facultad detectada
      localStorage.setItem("sesion", JSON.stringify({
        nombre: data.nombre,
        email: data.email,
        facultad: nombreFacultad
      }));

      mostrarExito("¡Bienvenido " + data.nombre + "!");

      setTimeout(() => {
        const modal = bootstrap.Modal.getInstance(document.getElementById('loginModal'));
        modal.hide();
        actualizarBotonSesion();
      }, 1000);

    } catch (err) {
      mostrarError(err.message || "Error de conexión");
    }
  });
}

function mostrarError(msg) { mensaje.innerHTML = `<div class="alert alert-danger py-2">${msg}</div>`; }
function mostrarExito(msg) { mensaje.innerHTML = `<div class="alert alert-success py-2">${msg}</div>`; }

// Función para actualizar la UI: Perfil + Facultad Dinámica
function actualizarBotonSesion() {
  const authArea = document.getElementById("authArea");
  const facultadNav = document.getElementById("facultadNav");
  const sesion = JSON.parse(localStorage.getItem("sesion"));

  if (sesion) {
    // 🎓 Mostrar facultad al lado de Grupos
    if (facultadNav) {
      facultadNav.innerHTML = `🎓 ${sesion.facultad}`;
    }

    // Mostrar menú de usuario
    authArea.innerHTML = `
      <div class="dropdown">
        <button class="btn btn-light btn-sm dropdown-toggle fw-bold" data-bs-toggle="dropdown">
          ${sesion.nombre.split(' ')[0]}
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow" style="min-width:250px;">
          <li class="px-3 py-2 text-center">
            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(sesion.nombre)}&background=0D6EFD&color=fff" class="rounded-circle mb-2" width="50">
            <div class="fw-bold">${sesion.nombre}</div>
            <small class="text-muted">${sesion.facultad}</small>
          </li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item text-danger" id="logout">Cerrar sesión</button></li>
        </ul>
      </div>`;

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("sesion");
      location.reload();
    });

  } else {
    // Limpiar si no hay sesión
    if (facultadNav) facultadNav.textContent = "";
    authArea.innerHTML = `
      <button class="btn btn-light btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#loginModal">
        Iniciar sesión
      </button>`;
  }
}

document.addEventListener("DOMContentLoaded", actualizarBotonSesion);
</script>
</body>
</html>
