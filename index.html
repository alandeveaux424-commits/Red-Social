<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red UNAM</title>
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/styles.css">
</head>
<body>

<!-- 🔵 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="images/logoUNAM.png" width="45" class="me-2">
      Red UNAM
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link active" href="index.html">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="noticias.html">Noticias</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="grupos.html">Grupos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="facultad.html" id="facultadNav"></a>
        </li>
      </ul>
    </div>

    <!-- 🔐 AUTH AREA -->
    <div id="authArea">
      <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">
        Iniciar sesión
      </button>
    </div>
  </div>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<div class="container mt-4 text-center">
  <h1>Bienvenido a Red UNAM</h1>
  <p>Comunidad estudiantil universitaria</p>
</div>

<!-- 🔵 GACETA UNAM -->
<div class="container mt-4">
  <h3 class="text-center mb-3">Gaceta UNAM</h3>
  <div class="ratio ratio-16x9 border rounded shadow">
    <iframe src="https://www.gaceta.unam.mx/" style="border:0;" loading="lazy"></iframe>
  </div>
  <p class="text-center mt-2">
    <a href="https://www.gaceta.unam.mx/" target="_blank">Ir a Gaceta UNAM</a>
  </p>
</div>

<!-- 🔥 MODAL LOGIN -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="card p-4">
        <div class="text-end">
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="text-center mb-3">
          <h3>Iniciar sesión</h3>
        </div>
        <form id="formLogin">
          <input type="text" class="form-control mb-3" id="emailLogin" placeholder="Correo @unam.mx o número de cuenta" required>
          <input type="password" class="form-control mb-3" id="passwordLogin" placeholder="Contraseña" required>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="text-center mt-3">
          ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </p>
        <div id="mensaje" class="mt-3 text-center"></div>
      </div>
    </div>
  </div>
</div>

<!-- 🛠 SCRIPTS -->

<!-- 1. Librería Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Tu conexión (Debe estar aquí o en un archivo externo js/conexion.js) -->
<script src="js/conexion.js"></script>

<script>
const form = document.getElementById("formLogin");
const mensaje = document.getElementById("mensaje");

// ========================
// LOGIN CON SUPABASE
// ========================
if (form) {
  form.addEventListener("submit", async function(e) {
    e.preventDefault();
    
    const input = document.getElementById("emailLogin").value.trim();
    const password = document.getElementById("passwordLogin").value;

    if (!input || !password) return mostrarError("Completa todos los campos");

    try {
      // Consulta flexible: Email o Número de cuenta[cite: 1]
      const { data, error } = await window.supabaseClient
        .from('usuarios')
        .select('*')
        .or(`email.eq.${input},numero_cuenta.eq.${input}`)
        .single();

      if (error || !data) throw new Error("Usuario no encontrado");

      // Verificación de contraseña plana (para el alcance de tu proyecto)[cite: 1]
      if (data.password !== password) throw new Error("Contraseña incorrecta");

      // ÉXITO: Guardar sesión[cite: 1]
      localStorage.setItem("sesion", JSON.stringify(data));
      mostrarExito("¡Bienvenido, " + data.nombre + "!");

      setTimeout(() => {
        const modalEl = document.getElementById('loginModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        modal.hide();
        actualizarBotonSesion();
      }, 1000);

    } catch (err) {
      mostrarError(err.message);
    }
  });
}

function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger py-2">${msg}</div>`;
}

function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success py-2">${msg}</div>`;
}

// ========================
// GESTIÓN DE INTERFAZ POST-LOGIN
// ========================
function actualizarBotonSesion() {
  const authArea = document.getElementById("authArea");
  const sesion = JSON.parse(localStorage.getItem("sesion"));
  const facultadNav = document.getElementById("facultadNav");

  if (sesion) {
    // Si tienes el campo facultad en tu tabla, lo mostramos aquí
    if (facultadNav) {
      facultadNav.innerHTML = `🎓 Mi Facultad`;
      facultadNav.href = "mi-perfil.html";
    }

    authArea.innerHTML = `
      <div class="dropdown">
        <button class="btn btn-light btn-sm dropdown-toggle" data-bs-toggle="dropdown">
          ${sesion.nombre}
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow">
          <li class="px-3 py-2 text-center">
            <img src="https://ui-avatars.com/api/?name=${sesion.nombre}&background=0D6EFD&color=fff" class="rounded-circle mb-2" width="50">
            <div class="fw-bold text-truncate" style="max-width: 150px;">${sesion.nombre}</div>
            <small class="text-muted">${sesion.email}</small>
          </li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item text-danger" id="logout">Cerrar sesión</button></li>
        </ul>
      </div>
    `;

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("sesion");
      location.reload();
    });

  } else {
    if (facultadNav) facultadNav.textContent = "";
    authArea.innerHTML = `
      <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">
        Iniciar sesión
      </button>
    `;
  }
}

document.addEventListener("DOMContentLoaded", actualizarBotonSesion);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
