<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Red UNAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/styles.css">
  <style>
    .registro-card { border-radius: 15px; border: none; }
    .form-control:focus { box-shadow: none; border-color: #0d6efd; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-3 shadow">
  <span class="navbar-brand mb-0 h1 fw-bold">Red UNAM</span>
  <div class="ms-auto">
    <img src="images/logoUNAM.png" alt="Logo" width="40">
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-lg p-4 registro-card" style="max-width: 400px; width: 100%;">

    <h3 class="text-center mb-2 fw-bold">Iniciar sesión</h3>
    <p class="text-center text-muted mb-4">Accede con tu cuenta institucional</p>

    <form id="formLogin">
      <div class="mb-3">
        <label class="form-label small">Correo o Número de Cuenta</label>
        <input type="text" class="form-control" id="email" placeholder="Correo o cuenta de 9 dígitos" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Entrar</button>
    </form>

    <p class="text-center mt-3 small">
      ¿No tienes cuenta? 
      <a href="registro.html" class="link-primary text-decoration-none fw-bold">Regístrate</a>
    </p>

    <div class="imagen-container mt-4 text-center">
      <img src="images/pumaUNAM.png" alt="UNAM" class="img-fluid" style="max-height: 80px; opacity: 0.8;">
    </div>

    <div id="mensaje" class="mt-3 text-center"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script>
const form    = document.getElementById("formLogin");
const mensaje = document.getElementById("mensaje");

const mapeoFacultades = {
  "@aragon.unam.mx": "FES Aragón",
  "@iztacala.unam.mx": "FES Iztacala",
  "@ingenieria.unam.mx": "Facultad de Ingeniería",
  "@arquitectura.unam.mx": "Facultad de Arquitectura",
  "@ciencias.unam.mx": "Facultad de Ciencias",
  "@politicas.unam.mx": "FCPyS",
  "@unam.mx": "UNAM"
};

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const inputEl    = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const input       = inputEl.value.trim();
  const password   = passwordEl.value;

  [inputEl, passwordEl].forEach(i => i.classList.remove("is-invalid", "is-valid"));
  mensaje.innerHTML = "";

  try {
    const { data, error } = await window.supabaseClient
      .from('usuarios')
      .select('*')
      .or(`email.eq."${input}",numero_cuenta.eq."${input}"`)
      .single();

    if (error || !data) {
      inputEl.classList.add("is-invalid");
      throw new Error("Usuario no encontrado o error de conexión");
    }

    if (data.password !== password) {
      passwordEl.classList.add("is-invalid");
      throw new Error("Contraseña incorrecta");
    }

    let nombreInst = "Comunidad UNAM";
    for (const dom in mapeoFacultades) {
      if (data.email.endsWith(dom)) {
        nombreInst = mapeoFacultades[dom];
        break;
      }
    }

    // --- MEJORA CRÍTICA: ESCRITURA Y VERIFICACIÓN ---
    const sesionInfo = {
      id: data.id,
      nombre: data.nombre,
      email: data.email,
      institucion: nombreInst
    };

    localStorage.setItem("sesion", JSON.stringify(sesionInfo));

    [inputEl, passwordEl].forEach(i => i.classList.add("is-valid"));
    mostrarExito(`¡Bienvenido, ${data.nombre}! Redirigiendo...`);

    let reintentos = 0;
    const checarEscritura = setInterval(() => {
      reintentos++;
      if (localStorage.getItem("sesion") !== null || reintentos > 10) {
        clearInterval(checarEscritura);
        window.location.replace("inicioRed.html");
      }
    }, 100);

  } catch (err) {
    mostrarError(err.message);
  }
});

function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger py-2 small">${msg}</div>`;
}
function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success py-2 small">${msg}</div>`;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
