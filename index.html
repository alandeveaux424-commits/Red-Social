<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Red UNAM</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style/styles.css">
</head>

<body>

<!-- 🔵 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">

    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="images/logoUNAM.png" width="45" class="me-2">
      Red UNAM
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">

        <li class="nav-item">
          <a class="nav-link active" href="index.html">Inicio</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="noticias.html">Noticias</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="grupos.html">Grupos</a>
        </li>

      </ul>
    </div>

    <!-- 🔐 AUTH AREA -->
    <div id="authArea">
      <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">
        Iniciar sesión
      </button>
    </div>

  </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-4 text-center">
  <h1>Bienvenido a Red UNAM</h1>
  <p>Comunidad estudiantil universitaria</p>
</div>

<!-- 🔵 GACETA -->
<div class="container mt-4">
  <h3 class="text-center mb-3">Gaceta UNAM</h3>

  <div class="ratio ratio-16x9 border rounded shadow">
    <iframe src="https://www.gaceta.unam.mx/" style="border:0;" loading="lazy"></iframe>
  </div>

  <p class="text-center mt-2">
    <a href="https://www.gaceta.unam.mx/" target="_blank">Ir a Gaceta UNAM</a>
  </p>
</div>

<!-- 🔥 MODAL LOGIN -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      
      <div class="card p-4">

        <div class="text-end">
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="text-center mb-3">
          <h3>Iniciar sesión</h3>
        </div>

        <form id="formLogin">

          <!-- 🔥 SOLO UN INPUT -->
          <input type="text" class="form-control mb-3" id="email" placeholder="Correo o número de cuenta">

          <input type="password" class="form-control mb-3" id="password" placeholder="Contraseña">

          <button class="btn btn-primary w-100">Iniciar sesión</button>

        </form>

        <p class="text-center mt-3">
          ¿No tienes cuenta?
          <a href="registro.html">Regístrate</a>
        </p>

        <div id="mensaje" class="mt-3 text-center"></div>

      </div>

    </div>
  </div>
</div>

<!-- JS -->
<script>

// ========================
// LOGIN CON BD
// ========================
const form = document.getElementById("formLogin");
const mensaje = document.getElementById("mensaje");

if (form) {
  form.addEventListener("submit", function(e) {
    e.preventDefault();

    const input = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!input || !password) {
      return mostrarError("Completa los campos");
    }

    const datos = new FormData();
    datos.append("input", input);
    datos.append("password", password);

    fetch("/RedSocial/php/login.php", {
      method: "POST",
      body: datos
    })
    .then(res => res.json())
    .then(data => {

      if (data.status === "success") {

        localStorage.setItem("sesion", JSON.stringify(data.usuario));

        mostrarExito("Bienvenido " + data.usuario.nombre);

        setTimeout(() => {
          const modal = bootstrap.Modal.getInstance(document.getElementById('loginModal'));
          modal.hide();
          actualizarBotonSesion();
        }, 1000);

      } else {
        mostrarError(data.message);
      }
    })
    .catch(() => {
      mostrarError("Error de conexión");
    });
  });
}

// ========================
// MENSAJES
// ========================
function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger">${msg}</div>`;
}

function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success">${msg}</div>`;
}

// ========================
// PERFIL
// ========================
function actualizarBotonSesion() {
  const authArea = document.getElementById("authArea");
  const sesion = JSON.parse(localStorage.getItem("sesion"));

  if (sesion) {
    authArea.innerHTML = `
      <div class="dropdown">
        <button class="btn btn-light btn-sm dropdown-toggle" data-bs-toggle="dropdown">
          ${sesion.nombre}
        </button>

        <ul class="dropdown-menu dropdown-menu-end" style="min-width:250px;">
          <li class="px-3 py-2">
            <strong>${sesion.nombre}</strong><br>
            <small>${sesion.email}</small>
          </li>

          <li><hr></li>

          <li>
            <button class="dropdown-item" id="logout">Cerrar sesión</button>
          </li>
        </ul>
      </div>
    `;

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("sesion");
      location.reload();
    });

  } else {
    authArea.innerHTML = `
      <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">
        Iniciar sesión
      </button>
    `;
  }
}

document.addEventListener("DOMContentLoaded", actualizarBotonSesion);

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
