<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red UNAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/styles.css">
  <style>
    .nav-link#facultadNav { color: #ffc107 !important; font-weight: bold; }
    .dropdown-menu { min-width: 280px; }
  </style>
</head>
<body>

<!-- 🔵 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="images/logoUNAM.png" width="45" class="me-2">
      <strong>Red UNAM</strong>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="noticias.html">Noticias</a></li>
        <li class="nav-item"><a class="nav-link" href="grupos.html">Grupos</a></li>
        <!-- 🎓 FACULTAD DINÁMICA (Al lado de grupos) -->
        <li class="nav-item">
          <a class="nav-link" href="facultad.html" id="facultadNav"></a>
        </li>
      </ul>
      <div id="authArea">
        <button class="btn btn-light btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#loginModal">
          Iniciar sesión
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-5 text-center">
  <h1>Bienvenido a Red UNAM</h1>
  <p class="lead">Comunidad estudiantil universitaria</p>
</div>

<!-- 🔵 GACETA -->
<div class="container mt-4 mb-5">
  <h3 class="text-center mb-3">Gaceta UNAM</h3>
  <div class="ratio ratio-16x9 border rounded shadow bg-light">
    <iframe src="https://www.gaceta.unam.mx/" style="border:0;" loading="lazy"></iframe>
  </div>
  <p class="text-center mt-3">
    <a href="https://www.gaceta.unam.mx/" target="_blank" class="btn btn-outline-primary btn-sm">Ir a Gaceta UNAM</a>
  </p>
</div>

<!-- 🔥 MODAL LOGIN -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="card p-4">
        <div class="text-end">
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="text-center mb-3">
          <h3>Iniciar sesión</h3>
        </div>
        <form id="formLogin">
          <div class="mb-3">
            <input type="text" class="form-control" id="email" placeholder="Correo o número de cuenta" required>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">Iniciar sesión</button>
        </form>
        <p class="text-center mt-3 small">
          ¿No tienes cuenta? <a href="registro.html" class="text-decoration-none">Regístrate</a>
        </p>
        <div id="mensaje" class="mt-3 text-center"></div>
      </div>
    </div>
  </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const form = document.getElementById("formLogin");
const mensaje = document.getElementById("mensaje");

// Mapeo actualizado con FES y Facultades
const mapeoFacultades = {
  "@aragon.unam.mx": "FES Aragón",
  "@iztacala.unam.mx": "FES Iztacala",
  "@ingenieria.unam.mx": "Facultad de Ingeniería",
  "@arquitectura.unam.mx": "Facultad de Arquitectura",
  "@fad.unam.mx": "Facultad de Artes y Diseño",
  "@ciencias.unam.mx": "Facultad de Ciencias",
  "@politicas.unam.mx": "Facultad de Ciencias Políticas y Sociales",
  "@fca.unam.mx": "Facultad de Contaduría y Administración",
  "@derecho.unam.mx": "Facultad de Derecho",
  "@economia.unam.mx": "Facultad de Economía",
  "@filos.unam.mx": "Facultad de Filosofía y Letras",
  "@facmed.unam.mx": "Facultad de Medicina",
  "@fmvz.unam.mx": "Facultad de Medicina Veterinaria y Zootecnia",
  "@musica.unam.mx": "Facultad de Música",
  "@odontologia.unam.mx": "Facultad de Odontología",
  "@psicologia.unam.mx": "Facultad de Psicología",
  "@quimica.unam.mx": "Facultad de Química",
  "@unam.mx": "UNAM"
};

if (form) {
  form.addEventListener("submit", async function(e) {
    e.preventDefault();
    const input = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const { data, error } = await window.supabaseClient
        .from('usuarios')
        .select('*')
        .or(`email.eq."${input}",numero_cuenta.eq."${input}"`)
        .single();

      if (error || !data) throw new Error("Credenciales incorrectas");
      if (data.password !== password) throw new Error("Contraseña incorrecta");

      // Identificar Institución
      let nombreInst = "Comunidad UNAM";
      for (const dom in mapeoFacultades) {
        if (data.email.endsWith(dom)) {
          nombreInst = mapeoFacultades[dom];
          break;
        }
      }

      localStorage.setItem("sesion", JSON.stringify({
        nombre: data.nombre,
        email: data.email,
        institucion: nombreInst
      }));

      mostrarExito("¡Bienvenido!");
      setTimeout(() => {
        bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
        actualizarBotonSesion();
      }, 1000);

    } catch (err) {
      mostrarError(err.message);
    }
  });
}

function actualizarBotonSesion() {
  const authArea = document.getElementById("authArea");
  const facultadNav = document.getElementById("facultadNav");
  const sesion = JSON.parse(localStorage.getItem("sesion"));

  if (sesion) {
    // 1. Texto dinámico en la Navbar (Al lado de grupos)
    if (facultadNav) facultadNav.innerHTML = `🎓 ${sesion.institucion}`;

    // 2. Menú de usuario con Correo e Institución abajo del nombre
    authArea.innerHTML = `
      <div class="dropdown">
        <button class="btn btn-light btn-sm dropdown-toggle fw-bold" data-bs-toggle="dropdown">
          ${sesion.nombre.split(' ')[0]}
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow p-3">
          <li class="text-center mb-2">
            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(sesion.nombre)}&background=0D6EFD&color=fff" class="rounded-circle mb-2" width="55">
            <div class="fw-bold text-primary">${sesion.nombre}</div>
            <div class="small text-muted mt-1" style="word-break: break-all;">${sesion.email}</div>
            <div class="fw-bold small text-info mt-1">${sesion.institucion}</div>
          </li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item text-danger text-center" id="logout">Cerrar sesión</button></li>
        </ul>
      </div>`;

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("sesion");
      location.reload();
    });
  } else {
    if (facultadNav) facultadNav.textContent = "";
    authArea.innerHTML = `<button class="btn btn-light btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#loginModal">Iniciar sesión</button>`;
  }
}

function mostrarError(msg) { mensaje.innerHTML = `<div class="alert alert-danger py-2 small">${msg}</div>`; }
function mostrarExito(msg) { mensaje.innerHTML = `<div class="alert alert-success py-2 small">${msg}</div>`; }

document.addEventListener("DOMContentLoaded", actualizarBotonSesion);
</script>
</body>
</html>
