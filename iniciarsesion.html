<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - Red UNAM</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="style/styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand mb-0 h1">Red UNAM</span>

  <div class="ms-auto">
    <img src="images/logoUNAM.png" alt="Logo" class="logo-navbar">
  </div>
</nav>

<!-- CONTENIDO -->
<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-lg p-4 registro-card">

    <h3 class="text-center mb-2">Iniciar sesión</h3>
    <p class="text-center text-muted mb-4">Accede con tu cuenta UNAM</p>

    <form id="formLogin">

      <!-- 🔥 UN SOLO INPUT -->
      <input type="text" class="form-control mb-3" id="email" placeholder="Correo o número de cuenta">

      <input type="password" class="form-control mb-3" id="password" placeholder="Contraseña">

      <button class="btn btn-primary w-100">Iniciar sesión</button>

    </form>

    <p class="text-center mt-3">
      ¿No tienes cuenta?
      <a href="registro.html" class="link-primary">Regístrate</a>
    </p>

    <div class="imagen-container mt-4">
      <img src="images/pumaUNAM.png" alt="UNAM" class="img-fluid imagen-unam">
    </div>

    <div id="mensaje" class="mt-3 text-center"></div>

  </div>
</div>

<!-- JS -->
<script>
const form = document.getElementById("formLogin");
const mensaje = document.getElementById("mensaje");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const input = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  mensaje.innerHTML = "";

  if (!input || !password) {
    return mostrarError("Completa todos los campos");
  }

  // 🔥 Enviar a PHP (SQLite)
  const datos = new FormData();
  datos.append("input", input);
  datos.append("password", password);

  fetch("/RedSocial/php/login.php", {
    method: "POST",
    body: datos
  })
  .then(res => res.text())
  .then(text => {
    console.log("RESPUESTA:", text);

    try {
      const data = JSON.parse(text);

      if (data.status === "success") {

        mostrarExito("Bienvenido " + data.usuario.nombre + " ✔");

        // Guardar sesión
        localStorage.setItem("sesion", JSON.stringify(data.usuario));

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1200);

      } else {
        mostrarError(data.message);
      }

    } catch {
      mostrarError("Respuesta inválida del servidor");
    }
  })
  .catch(error => {
    console.error("ERROR:", error);
    mostrarError("Error de conexión con el servidor");
  });
});

function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger">${msg}</div>`;
}

function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success">${msg}</div>`;
}
</script>

</body>
</html>
