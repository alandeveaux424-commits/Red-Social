<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Red UNAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/styles.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand mb-0 h1">Red UNAM</span>
  <div class="ms-auto">
    <img src="images/logoUNAM.png" alt="Logo" class="logo-navbar" width="40">
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-lg p-4 registro-card" style="max-width: 400px; width: 100%;">

    <h3 class="text-center mb-2">Iniciar sesión</h3>
    <p class="text-center text-muted mb-4">Accede con tu cuenta UNAM</p>

    <form id="formLogin">
      <div class="mb-3">
        <input type="text" class="form-control" id="email" placeholder="Correo o número de cuenta" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>

    <p class="text-center mt-3">
      ¿No tienes cuenta?
      <a href="registro.html" class="link-primary text-decoration-none">Regístrate</a>
    </p>

    <div class="imagen-container mt-4 text-center">
      <img src="images/pumaUNAM.png" alt="UNAM" class="img-fluid imagen-unam" style="max-height: 100px;">
    </div>

    <div id="mensaje" class="mt-3 text-center"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script>
const form    = document.getElementById("formLogin");
const mensaje = document.getElementById("mensaje");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const inputEl    = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const input      = inputEl.value.trim();
  const password   = passwordEl.value;

  [inputEl, passwordEl].forEach(i => i.classList.remove("is-invalid", "is-valid"));
  mensaje.innerHTML = "";

  if (!input || !password) {
    [inputEl, passwordEl].forEach(i => i.classList.add("is-invalid"));
    return mostrarError("Completa todos los campos");
  }

  try {
    // Hashear contraseña para comparar con la guardada
    const passwordHash = await window.hashPassword(password);

    const { data, error } = await window.supabaseClient
      .from('usuarios')
      .select('*')
      .or(`email.eq.${input},numero_cuenta.eq.${input}`)
      .eq('password', passwordHash)
      .single();

    if (error || !data) {
      [inputEl, passwordEl].forEach(i => i.classList.add("is-invalid"));
      throw new Error("Correo, número de cuenta o contraseña incorrectos");
    }

    [inputEl, passwordEl].forEach(i => i.classList.add("is-valid"));
    mostrarExito("¡Bienvenido, " + data.nombre + "! ✔");

    localStorage.setItem("sesion", JSON.stringify({
      id:            data.id,
      nombre:        data.nombre,
      email:         data.email,
      numero_cuenta: data.numero_cuenta
    }));

    setTimeout(() => { window.location.href = "index.html"; }, 1200);

  } catch (err) {
    console.error("Error en login:", err.message);
    mostrarError(err.message || "Error al conectar con la base de datos");
  }
});

function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger py-2">${msg}</div>`;
}
function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success py-2">${msg}</div>`;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
