<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Red UNAM</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="style/styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand mb-0 h1">Red UNAM</span>
  <div class="ms-auto">
    <img src="images/logoUNAM.png" alt="Logo" class="logo-navbar" width="40">
  </div>
</nav>

<!-- CONTENIDO -->
<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-lg p-4 registro-card" style="max-width: 400px; width: 100%;">

    <h3 class="text-center mb-2">Iniciar sesión</h3>
    <p class="text-center text-muted mb-4">Accede con tu cuenta UNAM</p>

    <form id="formLogin">
      <!-- INPUT PARA EMAIL O CUENTA -->
      <div class="mb-3">
        <input type="text" class="form-control" id="email" placeholder="Correo o número de cuenta" required>
      </div>

      <div class="mb-3">
        <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>

    <p class="text-center mt-3">
      ¿No tienes cuenta?
      <a href="registro.html" class="link-primary text-decoration-none">Regístrate</a>
    </p>

    <div class="imagen-container mt-4 text-center">
      <img src="images/pumaUNAM.png" alt="UNAM" class="img-fluid imagen-unam" style="max-height: 100px;">
    </div>

    <div id="mensaje" class="mt-3 text-center"></div>

  </div>
</div>

<!-- 🛠 SCRIPTS -->

<!-- 1. Librería Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Tu configuración (Asegúrate que js/conexion.js tenga tus llaves) -->
<script src="js/conexion.js"></script>

<script>
const form = document.getElementById("formLogin");
const mensaje = document.getElementById("mensaje");

// Usamos async para manejar la respuesta de Supabase
form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const input = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  mensaje.innerHTML = "";

  // Validación básica frontend
  if (!input || !password) {
    return mostrarError("Completa todos los campos");
  }

  try {
    // CONSULTA A SUPABASE: Buscamos por email o número de cuenta
    const { data, error } = await window.supabaseClient
      .from('usuarios')
      .select('*')
      .or(`email.eq."${input}",numero_cuenta.eq."${input}"`)
      .single();

    if (error || !data) {
      throw new Error("Usuario no encontrado");
    }

    // VERIFICACIÓN DE CONTRASEÑA
    // Nota: Para este nivel de proyecto comparamos directamente el string
    if (data.password !== password) {
      throw new Error("Contraseña incorrecta");
    }

    // ✅ ÉXITO: Guardar sesión en el navegador
    mostrarExito("¡Bienvenido, " + data.nombre + "! ✔");
    
    const usuarioSesion = {
      id: data.id,
      nombre: data.nombre,
      email: data.email,
      cuenta: data.numero_cuenta
    };
    
    localStorage.setItem("sesion", JSON.stringify(usuarioSesion));

    // Redirigir después de un momento
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1200);

  } catch (err) {
    console.error("Error en Login:", err.message);
    mostrarError(err.message || "Error al conectar con la base de datos");
  }
});

function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger">${msg}</div>`;
}

function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success">${msg}</div>`;
}
</script>

</body>
</html>
