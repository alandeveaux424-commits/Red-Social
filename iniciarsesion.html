<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - Red UNAM</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="style/styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand mb-0 h1">Red UNAM</span>

  <div class="ms-auto">
    <img src="images/logoUNAM.png" alt="Logo" class="logo-navbar">
  </div>
</nav>

<!-- CONTENIDO -->
<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-lg p-4 registro-card">

    <h3 class="text-center mb-2">Iniciar sesión</h3>
    <p class="text-center text-muted mb-4">Accede con tu cuenta UNAM</p>

    <form id="formLogin">

      <input type="text" class="form-control mb-3" id="nombre" placeholder="Nombre completo">

      <input type="text" class="form-control mb-3" id="email" placeholder="Correo institucional">

      <input type="text" class="form-control mb-3" id="cuenta" placeholder="Número de cuenta">

      <input type="password" class="form-control mb-3" id="password" placeholder="Contraseña">

      <button class="btn btn-primary w-100">Iniciar sesión</button>

    </form>

    <p class="text-center mt-3">
      ¿No tienes cuenta?
      <a href="registro.html" class="link-primary">Regístrate</a>
    </p>

    <div class="imagen-container mt-4">
      <img src="images/pumaUNAM.png" alt="UNAM" class="img-fluid imagen-unam">
    </div>

    <div id="mensaje" class="mt-3 text-center"></div>

  </div>
</div>

<!-- JS -->
<script>
// 🔥 USUARIOS PREDETERMINADOS
const usuariosBase = [
  {
    nombre: "Nathan Osnaya",
    email: "nathanosnaya321@aragon.unam.mx",
    cuenta: "321122876",
    password: "papafrita"
  },
  {
    nombre: "Jesús Espejel",
    email: "jesusespejel321@aragon.unam.mx",
    cuenta: "321275257",
    password: "todosconmike"
  }
];

// Inicializar base de datos
if (!localStorage.getItem("usuarios")) {
  localStorage.setItem("usuarios", JSON.stringify(usuariosBase));
}

const form = document.getElementById("formLogin");
const mensaje = document.getElementById("mensaje");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  // Inputs
  const nombreInput = document.getElementById("nombre");
  const emailInput = document.getElementById("email");
  const cuentaInput = document.getElementById("cuenta");
  const passwordInput = document.getElementById("password");

  const nombre = nombreInput.value.trim();
  const email = emailInput.value.trim();
  const cuenta = cuentaInput.value.trim();
  const password = passwordInput.value;

  let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

  // Reset estilos
  [nombreInput, emailInput, cuentaInput, passwordInput].forEach(input => {
    input.classList.remove("is-invalid", "is-valid");
  });

  let error = false;

  // Validaciones básicas
  if (!nombre) {
    nombreInput.classList.add("is-invalid");
    error = true;
  }

  if (!email || !email.includes("@")) {
    emailInput.classList.add("is-invalid");
    error = true;
  }

  if (!cuenta || cuenta.length !== 9) {
    cuentaInput.classList.add("is-invalid");
    error = true;
  }

  if (!password) {
    passwordInput.classList.add("is-invalid");
    error = true;
  }

  if (error) {
    return mostrarError("Completa correctamente los campos");
  }

  // 🔍 Buscar usuario
  const usuario = usuarios.find(u =>
    u.nombre === nombre &&
    u.email === email &&
    u.cuenta === cuenta &&
    u.password === password
  );

  if (!usuario) {
    [nombreInput, emailInput, cuentaInput, passwordInput].forEach(input => {
      input.classList.add("is-invalid");
    });

    return mostrarError("Datos incorrectos");
  }

  // 🟢 Correcto
  [nombreInput, emailInput, cuentaInput, passwordInput].forEach(input => {
    input.classList.add("is-valid");
  });

  mostrarExito("Inicio de sesión correcto ✔");

  localStorage.setItem("sesion", JSON.stringify(usuario));

  // 🔁 Redirigir a index (tu feed)
  setTimeout(() => {
    window.location.href = "index.html";
  }, 1200);
});

function mostrarError(msg) {
  mensaje.innerHTML = `<div class="alert alert-danger">${msg}</div>`;
}

function mostrarExito(msg) {
  mensaje.innerHTML = `<div class="alert alert-success">${msg}</div>`;
}
</script>

</body>
</html>
