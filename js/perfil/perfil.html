<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tus estilos -->
    <link rel="stylesheet" href="../style/styles.css">
    <link rel="stylesheet" href="../style/perfil.css">
</head>
<body>

<!--  NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container-fluid">

    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center" href="../inicioRed.html">
      <img src="../images/logoUNAM.png" width="45" class="me-2">
      <strong>Red UNAM</strong>
    </a>

    <!-- Responsive -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Contenido -->
    <div class="collapse navbar-collapse" id="navbarNav">

      <!-- IZQUIERDA -->
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="../inicioRed.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="../noticias.html">Noticias</a></li>
        <li class="nav-item"><a class="nav-link" href="../grupos.html">Grupos</a></li>
      </ul>

      <!-- DERECHA (USUARIO) -->
      <div class="dropdown">
        <button class="btn btn-light btn-sm dropdown-toggle fw-bold" data-bs-toggle="dropdown" id="btnUsuario">
          Usuario
        </button>

        <ul class="dropdown-menu dropdown-menu-end shadow p-3">

          <li class="text-center mb-2">
            <img id="fotoMini" class="rounded-circle mb-2" width="55">
            <div class="fw-bold text-primary" id="nombreMini"></div>
            <div class="small text-muted" id="correoMini"></div>
          </li>

          <li>
            <a class="dropdown-item text-center fw-bold border rounded" href="editperfil.html">
              Editar perfil
            </a>
          </li>

          <li><hr class="dropdown-divider"></li>

          <li>
            <button class="dropdown-item text-danger text-center fw-bold" id="logoutBtn">
              Cerrar sesión
            </button>
          </li>

        </ul>
      </div>

    </div>
  </div>
</nav>

<!-- PERFIL -->
<div class="container mt-4 text-center">

    <img id="fotoPerfil" class="rounded-circle mb-3" width="120">
    <h2 id="nombreUsuario"></h2>
    <p id="bioUsuario"></p>

</div>

<!-- MURO -->
<div class="container mt-4 mb-5">
    <h3>Publicaciones</h3>
    <div id="posts"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>
(function(){

  const sesionData = localStorage.getItem("sesion");

  // 🔒 Si no hay sesión → fuera
  if (!sesionData) {
    window.location.replace("../index.html");
    return;
  }

  const sesion = JSON.parse(sesionData);

  // 🔹 Navbar
  const nombreCorto = sesion.nombre ? sesion.nombre.split(" ")[0] : "Usuario";

  document.getElementById("btnUsuario").textContent = nombreCorto;
  document.getElementById("nombreMini").textContent = sesion.nombre || "";
  document.getElementById("correoMini").textContent = sesion.email || "";

  const avatarURL = `https://ui-avatars.com/api/?name=${encodeURIComponent(sesion.nombre)}&background=0D6EFD&color=fff`;

  document.getElementById("fotoMini").src = avatarURL;

  // Perfil principal
  document.getElementById("nombreUsuario").textContent = sesion.nombre || "";
  document.getElementById("bioUsuario").textContent = sesion.bio || "Sin biografía";
  document.getElementById("fotoPerfil").src = avatarURL;

  // Logout
  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("sesion");
    window.location.replace("../index.html");
  });

})();
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const dropdownTriggerList = document.querySelectorAll('[data-bs-toggle="dropdown"]');
  dropdownTriggerList.forEach(function (dropdownTriggerEl) {
    new bootstrap.Dropdown(dropdownTriggerEl);
  });
});
</script>

</body>
</html>
