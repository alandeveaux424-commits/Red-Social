<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>PaginaUwU</title>
</head>
<body class="bg-dark">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <!--logito-->
            <nav class="navbar bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">
                        <img src="/img/Coward.jpg" alt="Logo" width="40" height="45" class="d-inline-block align-text-top">
                        UNAM UwU
                    </a>
                </div>
            </nav>
            <!--navbar de secciones-->
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Red Social</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <button type="button" class="nav-link" data-bs-toggle="modal" data-bs-target="#loginModal">
                            Iniciar Sesión
                            </button>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Registrarse</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Secciones
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Noticias</a></li>
                                <li><a class="dropdown-item" href="#">Grupos</a></li>
                                <li><a class="dropdown-item" href="#">Reels</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!--contenido de la pagina-->
        
            <img src="/img/unam.svg" alt="Fondo_inicio" class="img-fluid">
        </div>
        
        <!--pagina modal con inicio de sesion-->
        <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 bg-transparent"> 
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-end">
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="text-center mb-4">
                                <h1>Bienvenido a UNAM UwU</h1>
                                <p class="text-muted">Ingresa tu cuenta institucional para interactuar con la comunidad estudiantil</p>
                            </div>
                            <form action="/login" method="POST">
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold text-automatic">Correo electrónico</label>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="nombre@unam.mx" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold text-automatic">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Tu contraseña" required>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" id="rememberMe">
                                        <label class="form-check-label text-light" for="rememberMe">Recordarme</label>
                                    </div>
                                        <a href="#" class="text-decoration-none text-primary small">¿Olvidaste tu contraseña?</a>
                                </div>
                                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Iniciar Sesión</button>
                            </form>
                                <hr class="my-4">
                            <div class="text-center">
                                <p class="mb-0 text-automatic">¿No tienes una cuenta? <a href="#" class="text-decoration-none fw-semibold">Regístrate aquí</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
