<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red UNAM - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/styles.css">
  <style>
    .nav-link#facultadNav { color: #ffc107 !important; font-weight: bold; }
    .dropdown-menu { min-width: 280px; }
    /* Evita el parpadeo ocultando el área hasta que el JS la llene */
    .auth-vacia { visibility: hidden; }
  </style>
</head>
<body>

<!-- 🔵 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="inicioRed.html">
      <img src="images/logoUNAM.png" width="45" class="me-2">
      <strong>Red UNAM</strong>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="inicioRed.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link active" href="noticias.html">Noticias</a></li>
        <li class="nav-item"><a class="nav-link active" href="grupos.html">Grupos</a></li>
        <!-- 🎓 FACULTAD DINÁMICA -->
        <li class="nav-item">
          <a class="nav-link auth-vacia" href="facultad.html" id="facultadNav"></a>
        </li>
      </ul>
      <!-- Área dinámica de usuario -->
      <div id="authArea" class="auth-vacia"></div>
    </div>
  </div>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<div class="container mt-5 text-center">
  <h1>Bienvenido a Red UNAM</h1>
  <p class="lead">Tu comunidad universitaria en un solo lugar.</p>
</div>

<!-- 🔵 GACETA UNAM -->
<div class="container mt-4 mb-5">
  <h3 class="text-center mb-3">Gaceta UNAM</h3>
  <div class="ratio ratio-16x9 border rounded shadow bg-light">
    <iframe src="https://www.gaceta.unam.mx/" style="border:0;" loading="lazy"></iframe>
  </div>
</div>

<!-- JS de Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ⚡ LÓGICA DE PERSISTENCIA REAL (ANTI-REFRESH) -->
<script>
  (function() {
    function cargarInterfaz() {
      const authArea = document.getElementById("authArea");
      const facultadNav = document.getElementById("facultadNav");
      const sesionData = localStorage.getItem("sesion");

      // 1. Protección de ruta: Si no hay sesión, al login
      if (!sesionData) {
        window.location.replace("index.html");
        return;
      }

      const sesion = JSON.parse(sesionData);

      // 2. Inyectar datos en la interfaz
      if (facultadNav) {
        facultadNav.innerHTML = `🎓 ${sesion.institucion}`;
        facultadNav.classList.remove("auth-vacia");
      }

      if (authArea) {
        authArea.innerHTML = `
          <div class="dropdown">
            <button class="btn btn-light btn-sm dropdown-toggle fw-bold" data-bs-toggle="dropdown">
              ${sesion.nombre.split(' ')[0]}
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow p-3">
              <li class="text-center mb-2">
                <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(sesion.nombre)}&background=0D6EFD&color=fff" 
                     class="rounded-circle mb-2" width="55">
                <div class="fw-bold text-primary">${sesion.nombre}</div>
                <div class="small text-muted mt-1" style="word-break: break-all;">${sesion.email}</div>
                <div class="fw-bold small text-info mt-1">${sesion.institucion}</div>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item text-danger text-center fw-bold" id="logoutBtn">
                  Cerrar sesión
                </button>
              </li>
            </ul>
          </div>`;
        
        authArea.classList.remove("auth-vacia");

        // Evento de cierre de sesión
        document.getElementById("logoutBtn").onclick = function() {
          localStorage.removeItem("sesion");
          window.location.replace("index.html");
        };
      }
    }

    /**
     * SOLUCIÓN AL ERROR DE NAVEGACIÓN:
     * 'pageshow' se activa siempre, incluso si el navegador carga la página
     * desde la memoria caché al usar el botón 'atrás' o navegar entre archivos locales.
     */
    window.addEventListener('pageshow', function(event) {
      // Si la página viene de caché, forzamos recarga; si no, cargamos interfaz
      if (event.persisted) {
        window.location.reload();
      } else {
        cargarInterfaz();
      }
    });

    // Ejecutar inmediatamente al cargar el archivo
    cargarInterfaz();
  })();
</script>

</body>
</html>
